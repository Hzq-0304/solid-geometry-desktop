[package]
name = "solid-geometry-desktop"
version = "0.1.0"
description = "Solid geometry desktop workspace"
authors = ["Solid Geometry Studio"]
edition = "2021"

[lib]
name = "solid_geometry_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "solid-geometry-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
